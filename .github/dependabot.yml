# Dependabot configuration for the Dumont monorepo.
# Frontend uses a pnpm workspace at the repo root (`pnpm-workspace.yaml`) —
# Dependabot discovers every workspace member (dumont-react + the connector
# plugin samples) from the root `pnpm-lock.yaml`, so a single `npm` block
# covers them all.
#
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2026.3"
    open-pull-requests-limit: 15
    groups:
      java:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2026.3"
    open-pull-requests-limit: 15
    ignore:
      # Pinned across the whole workspace — MF + Rolldown in recent Vite break the
      # build with REQUIRE_TLA (react-dom CJS → MF TLA virtual). typescript is held
      # back so tsc output stays stable. Unpin once upstream fixes land.
      - dependency-name: "typescript"
      - dependency-name: "vite"
      - dependency-name: "@module-federation/vite"
    groups:
      react:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2026.3"
    open-pull-requests-limit: 5
    # Track only the JDK/JRE base image; keep it on Java 21 LTS. Java 25 breaks
    # embedded Artemis 2.43.0 (Netty CleanerJava25 "Cannot clean arbitrary
    # ByteBuffer instances"). Allow 21.x patch/minor bumps, never a major to 25+.
    allow:
      - dependency-name: "eclipse-temurin"
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2026.3"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
