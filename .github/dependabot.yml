# To get started with Dependabot version updates, you'll need to specify which
# Package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    open-pull-requests-limit: 15
    groups:
      java:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/dumont-react"
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    open-pull-requests-limit: 15
    ignore:
      # Pinned — MF 1.14.5 + Rolldown in Vite 8.0.9 break the build with REQUIRE_TLA
      # (react-dom CJS → MF TLA virtual). Unpin once upstream fixes land.
      - dependency-name: "vite"
      - dependency-name: "@module-federation/vite"
    groups:
      react:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/aem/aem-plugin-sample/turing-export/app"
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    open-pull-requests-limit: 15
    groups:
      react:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/assets/assets-plugin-sample/turing-export/app"
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    open-pull-requests-limit: 15
    groups:
      react:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/db/db-plugin-sample/turing-export/app"
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    open-pull-requests-limit: 15
    groups:
      react:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web-crawler/wc-plugin-sample/turing-export/app"
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    open-pull-requests-limit: 15
    groups:
      react:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
