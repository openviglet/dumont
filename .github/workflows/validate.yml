# D50 — the build, on every push and pull request.
#
# This workflow runs the Maven build, the console build and a SonarCloud analysis, and until now
# its only trigger was `workflow_dispatch`. It gated nothing: a pull request could carry a failing
# backend build and report every check green, because the workflow that would have caught it was
# never asked to run. `roadkeep` and `design-system` were the only two that fired on a push.
#
# Sonar runs on pushes only. A pull request from a fork has no access to `SONAR_TOKEN`, so the
# analysis would fail for a reason the contributor cannot fix — and branch analysis of a merge
# ref is the wrong thing to record anyway. The *build* runs on both, which is the part that gates.

name: Java CI with Maven and SonarCloud

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      # The frontend is a pnpm workspace. The Maven build installs its own Node and pnpm through
      # frontend-maven-plugin, so these two exist for the cache below and to keep a local
      # `pnpm` invocation on the same version as the one Maven downloads.
      - uses: pnpm/action-setup@v4

      - name: Use Node.js 26.3.1
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: pnpm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Builds every module and the console, which is what a pull request needs checked. Runs on
      # pushes too, so a branch with no analysis secret still gets built.
      - name: Build
        run: mvn -B verify -Dgpg.skip=true

      # `sonar.branch.name` was pinned to `2026.2` — the previous version — so every analysis
      # landed on the wrong branch. Taken from the ref being built instead, which cannot go stale.
      - name: Analyze
        if: github.event_name == 'push' && github.repository == 'openviglet/dumont'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dgpg.skip=true
          -Dsonar.projectKey=viglet_dumont
          -Dsonar.branch.name=${{ github.ref_name }}
