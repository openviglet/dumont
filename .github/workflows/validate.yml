# D50 — the build, on every push and pull request.
#
# This workflow runs the Maven build and the console build, and until D50 its only trigger was
# `workflow_dispatch`. It gated nothing: a pull request could carry a failing backend build and
# report every check green, because the workflow that would have caught it was never asked to run.
#
# There is no SonarCloud step any more. Its token had expired unnoticed for months, so the job
# went red on an analysis nobody read; code quality is checked locally against the SonarQube stack
# in the Turing repo (scripts/sonar/).

name: Java CI with Maven

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      # D254: no README points at Dumont's old homes (www.viglet.org/dumont, docs.viglet.org/dumont).
      - name: README links
        run: node scripts/check-readme-links.mjs

      # The frontend is a pnpm workspace. The Maven build installs its own Node and pnpm through
      # frontend-maven-plugin, so these two exist for the cache below and to keep a local
      # `pnpm` invocation on the same version as the one Maven downloads.
      - uses: pnpm/action-setup@v6

      - name: Use Node.js 26.3.1
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: pnpm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Builds every module and the console, which is what a pull request needs checked.
      - name: Build
        run: mvn -B verify -Dgpg.skip=true
