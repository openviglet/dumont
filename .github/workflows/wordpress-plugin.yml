# D145: the WordPress plugin's own gate and release.
#
# The plugin under wordpress/ is PHP and the Maven build never reads it, so nothing checked it
# until this workflow. Every change to it runs PHPCS (WordPress Coding Standards), PHPStan and
# PHPUnit on the lowest PHP it supports and on a current one.
#
# A tag wordpress-v<version> publishes the installable zip on that tag's GitHub release. The zip
# holds one viglet-dumont/ folder, so it uploads under Plugins > Add New and installs with
# Composer through a package repository entry (wordpress/README.md shows it). bin/build-zip.sh
# refuses a tag that disagrees with the plugin header.

name: WordPress plugin

on:
  push:
    paths:
      - wordpress/**
      - .github/workflows/wordpress-plugin.yml
    tags:
      - wordpress-v*
  pull_request:
    paths:
      - wordpress/**
      - .github/workflows/wordpress-plugin.yml
  workflow_dispatch:
    inputs:
      turing_image:
        description: The Turing image the browser suite runs against
        required: false
        default: ghcr.io/openviglet/turing-ce:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: wordpress

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dev tools
        run: composer install --no-interaction --no-progress

      - name: PHPCS, PHPStan and PHPUnit
        run: composer check

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wordpress/package-lock.json

      - name: Install, lint and build the admin screens
        run: |
          npm ci
          npm run lint:js
          npm run build

  # D182: the browser suite (npm run test:e2e) against a real WordPress and Turing, so a
  # regression in the block, an admin screen, a theme or the pt_BR strings fails here rather
  # than on the next laptop run. The Turing it ran against is logged from /api/discovery; a
  # dispatch can name another image. Baselines are per platform: a screenshot with no linux
  # baseline yet is written, not failed, and uploaded with the artifacts to be reviewed and
  # committed under tests/e2e/snapshots/linux/.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TURING_IMAGE: ${{ inputs.turing_image || 'ghcr.io/openviglet/turing-ce:latest' }}
      E2E_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wordpress/package-lock.json

      - name: Install, and the browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start WordPress and Turing
        run: sh bin/run-docker.sh

      - name: The Turing under test
        run: curl -sf "http://localhost:2700/api/discovery"

      - name: Browser suite
        run: npx playwright test --update-snapshots=missing

      - name: Keep the screens, the report and any new baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            wordpress/tests/e2e/artifacts/
            wordpress/tests/e2e/snapshots/linux/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/wordpress-v')
    needs: [check, admin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the admin screens
        working-directory: wordpress
        run: npm ci && npm run build

      - name: Build the plugin zip
        id: zip
        run: echo "path=wordpress/$(sh bin/build-zip.sh "${GITHUB_REF_NAME#wordpress-v}")" >> "$GITHUB_OUTPUT"

      - name: Attach it to the release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "WordPress plugin ${GITHUB_REF_NAME#wordpress-v}" --notes "See wordpress/src/readme.txt for the changelog."
          gh release upload "$GITHUB_REF_NAME" "${{ steps.zip.outputs.path }}" --clobber
