# dumont.viglet.org, built and published by CI.
#
# Two things go into the published tree:
#   * the site itself, `dumont-site/` (Vite + React, prerendered to one static
#     index.html per route plus a Markdown twin), at the root;
#   * the marketplace, one folder per `*-plugin-sample/turing-export/app`, under
#     /marketplace/<slug>/ with the importable zip and its README rendered as the
#     folder's index.
#
# `workflow_dispatch` only: the site is the one artefact where a defect is public
# immediately, so a publish is a decision rather than a side effect of a push.
#
# Published from this repository with the native Pages deploy, so it needs no
# secret: the job's GITHUB_TOKEN carries `pages: write`. One-time repository
# setting: Settings → Pages → Source = "GitHub Actions", custom domain
# dumont.viglet.org. With an Actions deploy the domain lives in that setting; the
# CNAME in the artefact is kept only so a local `dist/` says where it belongs.
name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish dumont.viglet.org
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: "pnpm"

      # The site, the samples and the README renderer's `marked` all come from the
      # workspace lockfile.
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # tsc -b → vite build → vite build --ssr → prerender → og-image.
      - name: Build the site
        run: pnpm run build:site

      # Each sample's `package` script starts with an `npm install`, which a pnpm
      # workspace member refuses; the workspace install above already did it, so
      # only the build and the zip run here.
      - name: Build Marketplace examples
        run: |
          for dir in */*-plugin-sample/turing-export/app; do
            [ -d "$dir" ] || continue
            project=$(basename "$(dirname "$(dirname "$dir")")")
            echo "::group::Building $project"
            (cd "$dir" && pnpm run compile:build && pnpm run zip)
            echo "::endgroup::"
          done

      - name: Assemble _site
        run: |
          # The prerendered site at the root: index.html per route, hashed assets,
          # and the static files from dumont-site/public (robots.txt, sitemap.xml,
          # llms.txt, favicon, og image). `dist-ssr/` is a build input and stays out.
          mkdir -p _site/marketplace
          cp -r dumont-site/dist/* _site/

          for dir in */*-plugin-sample/turing-export/app; do
            [ -d "$dir" ] || continue
            site=$(node -p "require('./$dir/package.json').name.replace(/^turing-example-/, '')")
            mkdir -p "_site/marketplace/$site"
            cp "$dir"/*.zip "_site/marketplace/$site/"
            cp "$dir"/dist/turing-manifest.json "_site/marketplace/$site/" 2>/dev/null || true

            # Render README.md (if present) as a styled index.html at the root of the project folder.
            if [ -f "$dir/README.md" ]; then
              cp "$dir/README.md" "_site/marketplace/$site/README.md"
              zip_name=$(basename "$(ls "$dir"/*.zip 2>/dev/null | head -n1)" 2>/dev/null || true)
              node dumont-site/scripts/render-readme.mjs \
                "$dir/README.md" \
                "_site/marketplace/$site/index.html" \
                "$site" \
                "$zip_name"
            fi
          done

          # The landing page links every sample by slug; a sample that failed to
          # build would otherwise publish a link to a 404.
          for slug in wknd wknd-eds celestial-gallery retro-arcade wikipedia; do
            test -f "_site/marketplace/$slug/index.html" || { echo "marketplace/$slug has no index.html"; exit 1; }
          done
          test -f _site/index.html || { echo "no index.html in the assembled site"; exit 1; }

          find _site -name index.html | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
