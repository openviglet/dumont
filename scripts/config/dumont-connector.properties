# Dumont Connector - Sample Configuration
# Copy this file and edit the values below.
dumont.aem.querybuilder=true
dumont.aem.querybuilder.parallelism=10

# AEM Adobe I/O Events webhook
# Endpoint: POST /api/v2/aem/webhook/{source}
# Set to the Adobe Developer Console "API Key (Client ID)" of the OAuth Server-to-Server credential.
# When set, incoming POST events must carry a matching `recipient_client_id` field; otherwise rejected with 401.
# Leave commented to leave the endpoint open (dev only — logs a WARN at startup).
dumont.aem.webhook.adobe-io.client-id=YOUR_ADOBE_IO_CLIENT_ID

# AEM Adobe I/O journal (recovery for dropped webhooks)
# Pulls the same events behind a persisted cursor, so one lost to a 502 or a restart is recovered
# rather than left stale until the next full audit. Off by default; the webhook is unaffected.
#dumont.aem.journal.enabled=true
#dumont.aem.journal.poll-ms=60000
#dumont.aem.journal.client-id=YOUR_ADOBE_IO_CLIENT_ID
#dumont.aem.journal.client-secret=YOUR_ADOBE_IO_CLIENT_SECRET
# Journal URL of the event registration, keyed by Dumont source name.
#dumont.aem.journal.sources.wknd=https://events-va6.adobe.io/events/organizations/1/integrations/2/3

# Indexing provider (options: turing, elasticsearch, solr)
dumont.indexing.provider=turing

# Turing ES connection
turing.url=http://localhost:2700
turing.apiKey=YOUR_TURING_API_KEY

# Elasticsearch connection
dumont.indexing.elasticsearch.url=http://localhost:9200
dumont.indexing.elasticsearch.index=dumont

# Solr connection
dumont.indexing.solr.url=http://localhost:8983/solr
dumont.indexing.solr.core=dumont

# Server port (use different ports for multiple connector instances)
server.port=30130

# Database (default: embedded H2 — uncomment below for PostgreSQL)
# spring.datasource.url=jdbc:postgresql://localhost:5432/dumont_db
# spring.datasource.username=dumont
# spring.datasource.password=changeme
# spring.datasource.driver-class-name=org.postgresql.Driver
