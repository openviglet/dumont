server:
  port: 30130
  servlet:
    session:
      cookie:
        name: DUMJSESSIONID

turing:
  url: http://localhost:2700
  apiKey: 4618ac5e0e5640f8bd8ea8c83
  solr:
    endpoint: http://localhost:8983

dumont:
  url: http://localhost:30130
  allowedOrigins: "http://localhost:5173,http://localhost:2700"
  multi-tenant: false
  # Authentication / permission model.
  # permissions=false grants ROLE_ADMIN + all privileges to every authenticated user.
  permissions: true
  # When keycloak=true, Spring Security delegates login to the Keycloak realm
  # configured under spring.security.oauth2.client.provider.keycloak.
  keycloak: false
  keycloak-admin-id: ~
  authentication:
    # Enable third-party OAuth2 login buttons (Google, GitHub, ...)
    thirdparty: true
    # Enable the /api/v2/user/register self-service sign-up endpoint.
    new-user: false
  job.size: 50
  cron: "-"
  cron.zone: UTC
  audit:
    cron: "0 0 3 * * *"
    cron.zone: UTC
    index:
      # D64: compare the source and the connector's ledger against the search index itself, so a
      # document that never landed, or whose later write failed, is found and requeued instead of
      # staying silently wrong. Orphans (in the index, gone from the source) are reported, never
      # deleted. Requires a backend that can enumerate its index — Turing does.
      enabled: true
  dependencies.enabled: false
  reactive.indexing: false
  reactive.parallelism: 10
  # D34: per-extract wall-clock bound (ms); 0 disables it (no extraction is cancelled for time).
  reactive.extractTimeoutMs: 0
  # D34: finish standalone (no deindex) when this fraction of a run's extractions fail; 0 disables.
  reactive.failureRatioThreshold: 0.5
  dns:
    cache:
      ttl: 60
      negative.ttl: 0
  aem.querybuilder: true
  aem.querybuilder.parallelism: 10
  aem:
    webhook:
      adobe-io:
        # Adobe Developer Console "API Key (Client ID)" of the OAuth Server-to-Server credential.
        # Used to validate the `recipient_client_id` field on incoming
        # POST /api/v2/aem/webhook/{source} requests from Adobe I/O Events.
        # Leave empty to keep the endpoint open (dev only — logs a WARN at startup).
        client-id: ~
    journal:
      # Pulls the same Adobe I/O events the webhook receives, behind a persisted cursor, so an
      # event lost to a 502 or a restart is recovered instead of waiting for the next full audit.
      # The webhook stays the low-latency route; this is the floor under it.
      enabled: false
      poll-ms: 60000
      batch-size: 100
      max-pages-per-poll: 20
      # OAuth Server-to-Server credential of the Adobe Developer Console project.
      client-id: ~
      client-secret: ~
      # Journal URL of the event registration, per Dumont source name. Journalling is enabled
      # automatically on every registration, so no extra Adobe-side setup is needed.
      #   sources:
      #     wknd: https://events-va6.adobe.io/events/organizations/1/integrations/2/3
      sources: {}
    delivery:
      # D67: overrides the Assets Search API path on the delivery host, for an instance that mounts
      # it somewhere other than /adobe/assets/search. Blank uses the default.
      assetSearchPath: ""
  scheduler:
    enabled: false
  plugins:
    # PF4J plugins directory. Single-JAR plugins dropped here are loaded on startup.
    directory: ./plugins
  indexing:
    # Indexing provider: turing, solr, or elasticsearch
    # Default is turing (if not specified)
    provider: turing
    # D63: send each source's declared field schema to the backend before its first document, so
    # fields exist as declared instead of being inferred from whichever value arrives first. A
    # rejected manifest is reported and indexing continues with the site's current schema.
    provision: true
    solr:
      # Solr configuration (required when provider is solr)
      url: http://localhost:8983/solr
      collection: dumont
    elasticsearch:
      # Elasticsearch configuration (required when provider is elasticsearch)
      url: http://localhost:9200
      index: dumont
      # Optional authentication
      username: ~
      password: ~
  # Persistent indexing log (mirrors turing.logging.*).
  # Switch logback config via `logging.config=classpath:logback-spring-mongo.xml`
  # or `classpath:logback-spring-redis.xml` to actually persist entries.
  logging:
    engine: none        # none | mongodb | redis
    database: dumontLog
    collection:
      server: server
      indexing: indexing
    purge:
      days: 30
  mongodb:
    enabled: false
    uri: mongodb://localhost:27017
  redis:
    enabled: false
    uri: redis://localhost:6379/0
    key:
      server: dumontLog:server
      indexing: dumontLog:indexing
    maxEntries:
      server: 10000
      indexing: 50000

spring:
  h2:
    console:
      enabled: false
      path: /h2
      settings:
        web-allow-others: true
  datasource:
    url: jdbc:h2:file:./store/db/dumontDB
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        "[globally_quoted_identifiers]": true
        "[enable_lazy_load_no_trans]": true
        "[generate_statistics]": false
      jakarta:
        persistence:
          sharedCache:
            mode: ALL
    hibernate:
      ddl-auto: update
    show-sql: false
  jmx:
    default-domain: com.viglet.dumont.connector.persistence.model
  output:
    ansi:
      enabled: always
  profiles:
    active: production
  artemis:
    mode: EMBEDDED
    broker-url: localhost:61616
    embedded:
      enabled: true
      persistent: true
      data-directory: store/queue
      queues: connector-indexing.queue
    pool:
      max-connections: 10
  jms:
    template:
      default-destination: connector-indexing.queue
logging:
  config: classpath:logback-spring.xml
  level:
    org:
      springframework: INFO
      apache: INFO
      "[apache.activemq]": ERROR
    com:
      viglet: INFO
  file:
    name: store/logs/dum-connector.log
  logback:
    rollingpolicy:
      max-file-size: 25MB
      max-history: 10
