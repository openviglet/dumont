# Dumont's roadkeep configuration — the fourth corpus, after Shio (RK20), roadkeep's own
# and Turing (RK21).
#
# WIRED INTO CI, and clean: `roadkeep lint` exits 0 under this file, which is what made the
# gate adoptable at all. It reported 9 findings until `[ids] pad` below was declared —
# `D01`-`D09` on `id.format`, roadkeep refusing zero padding because `D01` and `D1` would
# otherwise be two spellings of one id. Dumont pads *consistently*, so declaring the width
# is what says there is only ever one spelling, and no line was rewritten.
#
# It reported 43 when this file was first written. The other 34 were every ledger entry, on
# `block.missing`, because roadkeep hardcoded the heading word as `Block` against this
# file's `## Track A` -- adopting Dumont is what found that, and `[headings] word` below is
# what RK75 shipped for it.
#
# The roadmap is the interesting half: it holds **zero** open task lines — all eight tracks
# read "This track has no remaining pending tasks", and the pending work that existed was
# shipped. So nothing has to be migrated, and every line added from here goes through `add`
# and is refused at insertion. That is the cheapest adoption of the four, and the only one
# where the format costs nobody a rewrite.

prefix = "D"

# Dumont numbers its rationale by hand, not by task id: the scheme follows the file rather
# than the file following the scheme.
ref_scheme = "outline"

[files]
roadmap = "docs/ROADMAP.md"
changelog = "docs/CHANGELOG.md"
improvements = "docs/IMPROVEMENTS.md"
strategy = "docs/STRATEGY.md"

[ids]
# The width every id here is zero-filled to: `D01`, never `D1`. Declared rather than
# migrated — nine entries spell it this way and the format's rule is one spelling per id,
# which a fixed width states as well as no padding does.
pad = 2

[headings]
# Dumont files work under `## Track A`, not `## Block A` (RK75), so the word is
# declared and the label after it is the format's as everywhere else.
word = "Track"

[markers]
open = ["📋", "💭", "⏳", "🛠"]
shipped = "✅"
retired = "🗑"

[ledger]
# The two slots Dumont's ledger lines do not have: no marker, because the file itself is
# the statement that the work shipped (RK43), and no bold symptom, because every entry is
# `- **D01** — <prose>` (RK48). Declared here, so those 34 entries parse at all.
marker = false
symptom = false

[rules.changelog]
# The two prose rules this file's history cannot obey (RK52): its entries are paragraphs
# that predate the tool, and none of them ends in a stop. The roadmap keeps both rules,
# which — the roadmap being empty — means they hold for every line ever added to it.
one_sentence = false
terminator = false
