<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viglet Dumont: open-source connectors that keep your search index correct</title>
    <meta name="description" content="Open-source, self-hosted connectors from AEM, Edge Delivery Services, databases, files, web sites and JSON APIs into Turing ES, Solr or Elasticsearch, with a nightly audit and deletions that wait for review." />
    <meta name="theme-color" content="#0f766e" />
    <meta property="og:title" content="Viglet Dumont: open-source connectors that keep your search index correct" />
    <meta property="og:description" content="Your content in your search index, and kept there, correct. Open-source connectors for AEM, databases, files and the web." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dumont.viglet.org/" />
    <meta property="og:image" content="https://dumont.viglet.org/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <link rel="canonical" href="https://dumont.viglet.org/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://dumont.viglet.org/og.png" />
    <!-- anti-FOUC: apply the stored theme class before first paint (the prerendered HTML paints before the bundle) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("dumont-site-theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              globalThis.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* storage blocked: fall back to the default (light) theme */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
