<!doctype html>
<!--
  dumont.viglet.org/playground/: the WordPress demo is published by Viglet Turing, at
  /wp-demo/ (its /playground/ answers 404, D354). A transition redirect: GitHub Pages has no server redirects, so this static file
  (copied from public/ into dist/) redirects in the browser. It reaches the folder's index
  only; the files a Playground blueprint fetches from here are not HTML and cannot redirect.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viglet Turing WordPress demo</title>
    <link rel="canonical" href="https://turing.viglet.org/wp-demo/" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=https://turing.viglet.org/wp-demo/" />
    <script>
      location.replace("https://turing.viglet.org/wp-demo/");
    </script>
  </head>
  <body>
    <p>
      The WordPress demo is part of Viglet Turing. It moved to
      <a href="https://turing.viglet.org/wp-demo/">turing.viglet.org/wp-demo/</a>.
    </p>
  </body>
</html>
